name: CI

on:
  # Weekly, so a green badge means the tests pass now rather
  # than that they passed the day of the last push.
  schedule:
    - cron: "24 6 * * 0"
  push:
    branches: [master, main]
  pull_request:

jobs:
  spark-join-tuning:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Run equivalent joins on a real bounded Spark engine
        run: |
          pip install pyspark==4.0.1
          python benchmarks/spark_tuning.py --rows 200000 --repeats 3 --output spark-tuning.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: spark-tuning-evidence
          path: spark-tuning.json
          retention-days: 14

  pipeline-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r data_generator/requirements.txt
          pip install -r requirements.txt
          pip install pytest jsonschema statsmodels matplotlib pyarrow mlflow scikit-learn

      - name: Compile the decision-room application
        run: python -m py_compile streamlit_app.py app/*.py

      - name: Generate fresh synthetic data
        run: python data_generator/generate_data.py

      - name: Run the medallion pipeline end-to-end (bronze -> silver -> gold -> DQ -> publish)
        run: python pipeline/run_pipeline.py

      - name: Prove the DQ gate halts the publish on a critical failure
        run: |
          if python pipeline/run_pipeline.py --inject-dq-failure; then
            echo "::error::DQ gate FAILED to trip on an injected critical failure"
            exit 1
          else
            echo "DQ gate correctly halted the publish (exit code 2)"
          fi

      - name: Prove the data contract kills schema drift before Bronze
        run: |
          if python pipeline/run_pipeline.py --simulate-schema-drift; then
            echo "::error::contract enforcement FAILED to stop schema drift"
            exit 1
          else
            echo "contract correctly killed the run pre-Bronze (exit code 3)"
          fi

      - name: Quarantine demo (toxic rows isolated, pipeline still publishes)
        run: python pipeline/run_pipeline.py --inject-bad-rows 40

      - name: Streaming ingest demo (exactly-once drain)
        run: |
          python pipeline/stream_ingest.py --make-demo-file 500
          python pipeline/stream_ingest.py --drain
          python pipeline/stream_ingest.py --drain   # second drain must ingest nothing

      - name: Model lifecycle (drift watch -> registry promotion policy)
        run: python analytics/model_lifecycle.py

      - name: Sourcing risk + perfect-order decomposition
        run: python analytics/supply_risk.py

      - name: GIS network layers + nearest-node screening
        run: python analytics/geospatial_network.py

      - name: Inventory position, cover vs lead, and the transfer opportunity
        run: python analytics/inventory_health.py

      - name: Supplier scorecard, tier-vs-measurement, award shift
        run: python analytics/supplier_scorecard.py

      - name: Service-level economics (exchange curve + constant-spend re-allocation)
        run: python analytics/service_economics.py

      - name: Challenge S&OP alternatives against joint commercial and finance constraints
        run: python analytics/sop_review.py

      - name: Prove equivalent SQL and capture a bounded repeated performance run
        run: |
          pip install duckdb==1.5.4
          python benchmarks/query_performance.py --rows 100000 --repeats 3 --output /tmp/query-performance.json

      - name: The published analytics figures must be reproducible byte for byte
        run: |
          if git diff --quiet -- analytics/output/; then
            echo "every published figure regenerated byte for byte"
          else
            echo "::error::published figures are not reproducible:"
            git diff --stat -- analytics/output/ | while read -r line; do
              echo "::error::$line"
            done
            git diff --unified=0 -- analytics/output/ | head -40 | while read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

      - name: Run pipeline logic & data-invariant tests
        run: |
          # Bind pytest to the interpreter configured above and preserve a
          # useful public annotation if a clean Linux runner ever diverges.
          set +e
          python -m pytest tests/ -v 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            tail -60 pytest.log | while IFS= read -r line; do
              safe=${line//'%'/'%25'}
              safe=${safe//$'\r'/'%0D'}
              safe=${safe//$'\n'/'%0A'}
              echo "::error title=Pytest failure::$safe"
            done
          fi
          exit "$status"
