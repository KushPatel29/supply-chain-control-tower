name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  pipeline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r data_generator/requirements.txt
          pip install pytest statsmodels matplotlib pyarrow mlflow scikit-learn

      - name: Generate fresh synthetic data
        run: python data_generator/generate_data.py

      - name: Run the medallion pipeline end-to-end (bronze -> silver -> gold -> DQ -> publish)
        run: python pipeline/run_pipeline.py

      - name: Prove the DQ gate halts the publish on a critical failure
        run: |
          if python pipeline/run_pipeline.py --inject-dq-failure; then
            echo "::error::DQ gate FAILED to trip on an injected critical failure"
            exit 1
          else
            echo "DQ gate correctly halted the publish (exit code 2)"
          fi

      - name: Quarantine demo (toxic rows isolated, pipeline still publishes)
        run: python pipeline/run_pipeline.py --inject-bad-rows 40

      - name: Streaming ingest demo (exactly-once drain)
        run: |
          python pipeline/stream_ingest.py --make-demo-file 500
          python pipeline/stream_ingest.py --drain
          python pipeline/stream_ingest.py --drain   # second drain must ingest nothing

      - name: Model lifecycle (drift watch -> registry promotion policy)
        run: python analytics/model_lifecycle.py

      - name: Run pipeline logic & data-invariant tests
        run: pytest tests/ -v
